name: app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2+1
  sqflite_common: ^2.5.7  
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.3

  connectivity_plus: ^7.1.1

    
  # Dependencies for Excel export
  excel: ^4.0.6
  path_provider: ^2.1.5
  open_file: ^4.0.0

  cupertino_icons: ^1.0.8 
  window_manager: ^0.5.1
  file_picker: ^12.0.0-beta.7
  path: ^1.9.1
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  pdf: ^3.12.0
  shared_preferences: ^2.5.5
  printing: ^5.14.3

  # PDF viewing (Syncfusion) — commercial package; requires a free Syncfusion
  # community license (https://www.syncfusion.com/products/communitylicense)
  # or a commercial license before shipping.
  # Pinned to 33.2.x: newer Syncfusion versions require xml ^7.0.1, which
  # conflicts with excel 4.0.6 (xml <7.0.0).
  syncfusion_flutter_pdfviewer: ^33.2.13
  syncfusion_flutter_core: ^33.2.12
  # Cap xml to keep both excel (>=5.0.0 <7.0.0) and Syncfusion (<7.0.0) happy.
  xml: '>=6.5.0 <7.0.0'

  crypto: ^3.0.7
  universal_io: ^2.3.1
  sqflite_common_ffi_web: ^1.1.1
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_dotenv: ^6.0.1

dependency_overrides:
  # file_picker 12.0.0-beta.7 requires win32 ^6.3.0, but syncfusion_flutter_pdfviewer
  # 33.2.13 pulls device_info_plus ^12.x (win32 ^5.x). device_info_plus 13.x is built
  # against win32 ^6, resolving the clash while keeping Syncfusion on xml ^6 (which
  # excel 4.0.6 requires). device_info_plus is only a transitive dep here.
  device_info_plus: ^13.1.0
  # Vendored patched copy of syncfusion_flutter_pdfviewer: the package hard-codes a
  # 100% minimum zoom (_minScale = 1). The copy lowers it to 0.5 so the report modal
  # can zoom out to 50%. Re-apply the one-line patch on any version bump (see
  # third_party/syncfusion_flutter_pdfviewer/README.md).
  syncfusion_flutter_pdfviewer:
    path: third_party/syncfusion_flutter_pdfviewer


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0

  # For windows app size

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  
  assets:
    - .env
    - assets/images/tourism_office_logo.jpg
    - assets/images/qr-pic.png
    - assets/data/regions.json
    - assets/data/provinces_by_region.json
    - assets/data/cities_municipalities.json