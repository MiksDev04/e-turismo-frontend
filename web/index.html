<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="e-Turismo">

  <!--
    Makes the browser use the real device width as the layout viewport.
    Without this, mobile browsers fall back to a ~980px virtual viewport, so the
    app renders as a shrunken desktop page and the `width < 600` layout
    breakpoints never trigger. No maximum-scale / user-scalable=no on purpose:
    those disable pinch-zoom, and browser Ctrl +/- zoom must keep working.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="e-Turismo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>e-Turismo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script type="module" async>
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
    // Expose on window so the printing package (PdfPreview) can find it via
    // its `typeof pdfjsLib !== "undefined"` check instead of loading a second
    // copy of pdf.js from unpkg.
    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs";
  </script>
  <!--
    Ctrl + mouse-wheel page zoom. Flutter's engine registers a 'wheel' listener
    on the view root element and calls preventDefault() on it (Ctrl+wheel is
    turned into a pinch/scale pointer signal), which also suppresses the
    browser's Ctrl+wheel page zoom. Swallowing the event in the capture phase
    means the engine never sees it and never cancels it, so Chrome/Edge/Firefox
    zoom the whole page like they would on any other website. Unmodified wheel
    events are untouched, so normal scrolling keeps working.
  -->
  <script>
    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey) e.stopPropagation();
    }, { capture: true, passive: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
